name: FDC vendors — Probe42 fetch

# ONE-OFF, manual-only pull of Probe42 comprehensive-details for the EXTERNAL
# packaging-vendor list of our sister project "FDC" (data/fdc-vendors.json).
#
# It reuses the SAME VPN connect + IP-gate and the SAME Probe42 secrets as the
# mcAffeine "Probe42 refresh" workflow (.github/workflows/probe-refresh.yml). The
# only differences: it runs scripts/probe/fetch-fdc.mjs against the FDC list, and
# it does NOT commit anything — the pulled JSON is uploaded as a downloadable
# artifact (fdc-probe-cache/) so you can copy it into the FDC repo by hand.
#
# Probe42 prod is IP-whitelisted, so this routes the Probe42 host through the VPN
# BEFORE any call and HARD-ABORTS (no credit spent) if it isn't going through tun0.
#
# Secrets:  PROBE42_API_KEY_PROD, VPN_OVPN, VPN_USER, VPN_PASS
#           (old names PROBE42_API_KEY / VPN_CONFIG / VPN_USERNAME / VPN_PASSWORD
#            still work as a fallback — same as probe-refresh.yml).
# Variables (for prod): PROBE42_ENV=prod  (+ PROBE42_PATH_PREFIX /
#           PROBE42_REPORT_PREFIX / PROBE42_BASE_URL / PROBE42_API_VERSION as set
#           for the existing Probe42 workflow).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "survey = free datastatus check only (0 credits) · fetch = pull comprehensive-details (spends credits)"
        required: true
        default: "survey"
        type: choice
        options:
          - survey
          - fetch
      limit:
        description: "fetch only: MAX paid comprehensive pulls (credits) this run"
        required: false
        default: "15"
      only:
        description: "optional CSV of CINs/LLPINs to restrict this run to (blank = all vendors). Repo-cache preseeds (e.g. Manjushree) are always included."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  fetch-fdc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenVPN
        run: sudo apt-get update -y && sudo apt-get install -y openvpn

      - name: Write VPN config + auth file (not printed)
        env:
          VPN_CONFIG: ${{ secrets.VPN_OVPN || secrets.VPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USER || secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASS || secrets.VPN_PASSWORD }}
        run: |
          printf '%s\n' "$VPN_CONFIG" > client.ovpn
          u="$(printf '%s' "$VPN_USERNAME" | tr -d '\r\n')"
          p="$(printf '%s' "$VPN_PASSWORD" | tr -d '\r\n')"
          printf '%s\n%s\n' "$u" "$p" > vpn-auth.txt
          chmod 600 client.ovpn vpn-auth.txt
          if grep -q '^[[:space:]]*auth-user-pass' client.ovpn; then
            sed -i 's|^[[:space:]]*auth-user-pass.*|auth-user-pass vpn-auth.txt|' client.ovpn
          else
            echo 'auth-user-pass vpn-auth.txt' >> client.ovpn
          fi

      - name: Connect VPN
        run: |
          sudo openvpn --config client.ovpn --auth-user-pass vpn-auth.txt \
            --daemon --log vpn.log --writepid vpn.pid
          up=0
          for i in $(seq 1 30); do
            if ip addr show tun0 >/dev/null 2>&1; then up=1; break; fi
            sleep 2
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::VPN tunnel did not come up. Last 40 log lines:"
            sudo tail -n 40 vpn.log || true
            exit 1
          fi
          echo "✅ Tunnel is up (tun0)."

      - name: Route Probe42 through the VPN (aborts before any credit if it can't)
        env:
          PROBE42_BASE_URL: ${{ vars.PROBE42_BASE_URL }}
        run: |
          base="${PROBE42_BASE_URL:-https://api.probe42.in}"
          host="$(printf '%s' "$base" | sed -E 's#^https?://##; s#/.*##')"
          ips="$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u)"
          if [ -z "$ips" ]; then echo "::error::could not resolve $host"; exit 1; fi
          first=""
          for ip in $ips; do
            sudo ip route replace "$ip/32" dev tun0 || true
            [ -z "$first" ] && first="$ip"
          done
          # Pin the hostname to a routed IP so DNS can't hand Node an un-routed one mid-run.
          echo "$first $host" | sudo tee -a /etc/hosts >/dev/null
          echo "Routed $host through the VPN (IPs: $ips); pinned to $first"
          # HARD GATE: if Probe42 is not going through tun0, stop BEFORE spending a credit.
          if ip route get "$first" 2>/dev/null | grep -q 'dev tun0'; then
            echo "✅ Probe42 traffic will go through the VPN (whitelisted IP)."
          else
            echo "::error::Probe42 is NOT routed through the VPN — aborting before spending any credits."
            exit 1
          fi

      - name: Run FDC Probe42 fetch (survey = 0 credits, or live fetch — per mode)
        env:
          # production key; prefer the new name, fall back to the old one
          PROBE42_API_KEY: ${{ secrets.PROBE42_API_KEY_PROD || secrets.PROBE42_API_KEY }}
          PROBE42_BASE_URL: ${{ vars.PROBE42_BASE_URL }}
          PROBE42_PATH_PREFIX: ${{ vars.PROBE42_PATH_PREFIX }}
          PROBE42_REPORT_PREFIX: ${{ vars.PROBE42_REPORT_PREFIX }}
          PROBE42_API_VERSION: ${{ vars.PROBE42_API_VERSION }}
          PROBE42_ENV: ${{ vars.PROBE42_ENV }}
          MODE: ${{ github.event.inputs.mode }}
          LIMIT: ${{ github.event.inputs.limit }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          ONLY_ARG=""
          if [ -n "$ONLY" ]; then ONLY_ARG="--only $ONLY"; fi
          if [ "$MODE" = "fetch" ]; then
            node scripts/probe/fetch-fdc.mjs --live --limit "${LIMIT:-15}" $ONLY_ARG
          else
            node scripts/probe/fetch-fdc.mjs --status $ONLY_ARG
          fi

      # Deliver the pulled reports as a downloadable artifact so we can copy them
      # into the FDC repo. Nothing is committed to this repo (keeps it clean).
      - name: Upload FDC Probe42 cache as an artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fdc-probe-cache-${{ github.run_id }}
          path: fdc-probe-cache
          if-no-files-found: ignore
          retention-days: 7
