name: Probe42 VPN check (0 credits)

# ZERO-CREDIT setup verification.
#
# This connects the client VPN and prints the runner's public IP before and
# after, so you can confirm the Action now exits through the IP that Probe42 has
# whitelisted. It deliberately does NOT call the Probe42 API — so it spends no
# credits. Run it from the Actions tab AFTER adding the 4 secrets below.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions -> Secrets).
# New names are read first; old names still work as a fallback (in parentheses).
#   PROBE42_API_KEY_PROD   production Probe42 API key      (old: PROBE42_API_KEY)
#   VPN_OVPN               full contents of the .ovpn file (old: VPN_CONFIG)
#   VPN_USER               VPN login name, e.g. yash       (old: VPN_USERNAME)
#   VPN_PASS               VPN password                    (old: VPN_PASSWORD)
#
# See docs/PROBE42_SETUP.md for the full walkthrough.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vpn-check:
    runs-on: ubuntu-latest
    steps:
      - name: Public IP BEFORE VPN
        run: |
          echo "Runner public IP (before VPN):"
          curl -s https://api.ipify.org || echo "(ip service unreachable)"
          echo

      - name: Verify the 4 secrets exist (values are never printed)
        env:
          VPN_CONFIG: ${{ secrets.VPN_OVPN || secrets.VPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USER || secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASS || secrets.VPN_PASSWORD }}
          # Prefer the new production key; fall back to the old name if that's all that's set.
          PROBE42_API_KEY: ${{ secrets.PROBE42_API_KEY_PROD || secrets.PROBE42_API_KEY }}
        run: |
          fail=0
          for name in VPN_CONFIG VPN_USERNAME VPN_PASSWORD PROBE42_API_KEY; do
            val="${!name}"
            if [ -z "$val" ]; then echo "❌ missing: $name"; fail=1; else echo "✅ present: $name"; fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Add the missing secret(s) under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install OpenVPN
        run: sudo apt-get update -y && sudo apt-get install -y openvpn

      - name: Write VPN config + auth file (not printed)
        env:
          VPN_CONFIG: ${{ secrets.VPN_OVPN || secrets.VPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USER || secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASS || secrets.VPN_PASSWORD }}
        run: |
          printf '%s\n' "$VPN_CONFIG" > client.ovpn
          # Strip any stray CR/newlines from the pasted username/password so the
          # two-line auth file is exactly username\npassword (a common paste bug).
          u="$(printf '%s' "$VPN_USERNAME" | tr -d '\r\n')"
          p="$(printf '%s' "$VPN_PASSWORD" | tr -d '\r\n')"
          printf '%s\n%s\n' "$u" "$p" > vpn-auth.txt
          echo "username length: ${#u} chars · password length: ${#p} chars"
          chmod 600 client.ovpn vpn-auth.txt
          # Point the config at our credentials file instead of prompting.
          if grep -q '^[[:space:]]*auth-user-pass' client.ovpn; then
            sed -i 's|^[[:space:]]*auth-user-pass.*|auth-user-pass vpn-auth.txt|' client.ovpn
          else
            echo 'auth-user-pass vpn-auth.txt' >> client.ovpn
          fi

      - name: Connect VPN (no Probe42 call)
        run: |
          sudo openvpn --config client.ovpn --auth-user-pass vpn-auth.txt \
            --daemon --log vpn.log --writepid vpn.pid
          echo "Waiting for the tunnel (tun0) to come up…"
          up=0
          for i in $(seq 1 30); do
            if ip addr show tun0 >/dev/null 2>&1; then up=1; break; fi
            sleep 2
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::VPN tunnel did not come up. Last 40 log lines:"
            sudo tail -n 40 vpn.log || true
            exit 1
          fi
          echo "✅ Tunnel is up (tun0)."

      - name: Public IP AFTER VPN (should be your whitelisted IP)
        run: |
          sleep 3
          echo "Runner public IP (after VPN):"
          curl -s https://api.ipify.org || echo "(ip service unreachable)"
          echo
          echo "→ Confirm this matches the IP Probe42 has whitelisted for your account."

      - name: Route Probe42 through the VPN and confirm the exit IP (still 0 credits)
        env:
          PROBE42_BASE_URL: ${{ vars.PROBE42_BASE_URL }}
          EXPECTED_IP: ${{ vars.VPN_EXPECTED_EXIT_IP }}
        run: |
          echo "=== Routing table (before fix) ==="
          ip route
          echo
          base="${PROBE42_BASE_URL:-https://api.probe42.in}"
          host="$(printf '%s' "$base" | sed -E 's#^https?://##; s#/.*##')"
          probe_ip="$(getent ahostsv4 "$host" | awk '{print $1; exit}')"
          echo_host="ifconfig.me"
          echo_ip="$(getent ahostsv4 "$echo_host" | awk '{print $1; exit}')"
          echo "Probe42 host $host -> ${probe_ip:-<dns failed>}"
          echo "test host    $echo_host -> ${echo_ip:-<dns failed>}"
          echo
          # Send Probe42 (and one IP-echo host, to read back our exit IP) through the
          # tunnel per-host, so the runner's own link to GitHub stays direct.
          [ -n "$probe_ip" ] && sudo ip route replace "$probe_ip/32" dev tun0 || true
          [ -n "$echo_ip" ]  && sudo ip route replace "$echo_ip/32"  dev tun0 || true
          echo "Route to Probe42 after fix:"; ip route get "$probe_ip" || true
          echo
          # What public IP do we appear as when going through the tunnel?
          exit_ip="$(curl -s --max-time 20 --resolve ${echo_host}:443:${echo_ip} https://${echo_host}/ip 2>/dev/null | tr -d '[:space:]')"
          echo "=== Exit IP through the VPN: ${exit_ip:-<no response>} ==="
          if [ -n "$EXPECTED_IP" ]; then
            echo "=== Whitelisted IP (VPN_EXPECTED_EXIT_IP): $EXPECTED_IP ==="
            if [ "$exit_ip" = "$EXPECTED_IP" ]; then
              echo "✅ MATCH — VPN traffic exits at your whitelisted IP. Probe42 will accept the call."
            elif [ -z "$exit_ip" ]; then
              echo "⚠️  No response through the tunnel — the VPN may block general internet egress. Check with Tech."
            else
              echo "⚠️  Exit IP != whitelisted IP. Share this log with Claude."
            fi
          else
            echo "→ Compare the exit IP above with your whitelisted IP (15.207.17.59). A match = Probe42 will accept it."
            [ -z "$exit_ip" ] && echo "⚠️  No response through the tunnel — the VPN may block internet egress; check with Tech."
          fi
          echo "(no Probe42 API was called — 0 credits)"

      - name: Done — 0 Probe42 credits spent
        run: echo "VPN checked. The Probe42 API was NOT called. Credits untouched."
